name: Pull Request

on:
  pull_request:
    branches:
      - master

jobs:
  verify-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TeleportPearlWorldGuard ${{ github.event.pull_request.number }}
          path: build/libs/*.jar
          retention-days: 7 # Deletes the file automatically after 5 days to save space